                                        </div>
                                    </div>
                                    <button className="lg:hidden p-1 text-zinc-400 hover:text-white rounded bg-zinc-800/50" onClick={() => setMobilePanel('none')}><X className="w-5 h-5" /></button>
                                </div>

                                <div 
                                    ref={trimmerRef} 
                                    onPointerDown={(e) => {
                                        // Allow jumping the playhead by tapping the background
                                        if (e.target === trimmerRef.current || e.target.classList.contains('trim-bg')) {
                                            const rect = trimmerRef.current.getBoundingClientRect();
                                            const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
                                            let percent = (clientX - rect.left) / rect.width;
                                            percent = Math.max(0, Math.min(1, percent));
                                            const newTime = percent * duration;
                                            audioRef.current.currentTime = newTime;
                                            setCurrentTime(newTime);
                                            handleTrimPointerDown(e, 'playhead');
                                        }
                                    }}
                                    className={`trim-bg relative h-12 sm:h-14 bg-zinc-950 rounded-xl border border-white/10 overflow-visible group select-none mt-1 shadow-inner touch-none cursor-pointer ${(!selectedEpisode?.audioUrl || audioError) ? 'opacity-50 pointer-events-none' : ''}`}
                                >
                                    {audioLoading && (
                                        <div className="absolute inset-0 z-50 bg-zinc-950/80 backdrop-blur-sm flex items-center justify-center rounded-xl pointer-events-none">
                                            <RefreshCw className="w-4 h-4 text-indigo-400 animate-spin mr-2" />
                                            <span className="text-xs font-bold text-indigo-400 uppercase tracking-widest">Loading Audio...</span>
                                        </div>
                                    )}
                                    {audioError && !audioLoading && (
                                        <div className="absolute inset-0 z-50 bg-rose-950/80 backdrop-blur-sm flex items-center justify-center rounded-xl border border-rose-500/50 pointer-events-none">
                                            <Info className="w-4 h-4 text-rose-400 mr-2" />
                                            <span className="text-xs font-bold text-rose-400 uppercase tracking-widest">Audio Blocked by CORS</span>
                                        </div>
                                    )}

                                    <div className="trim-bg absolute inset-0 opacity-10 flex items-center justify-between px-1 pointer-events-none overflow-hidden rounded-xl">
                                         {Array.from({length: 120}).map((_, i) => (<div key={i} className="w-1 bg-white rounded-full pointer-events-none" style={{ height: `${Math.random() * 80 + 10}%` }}></div>))}
                                    </div>
                                    
                                    {/* Playhead */}
                                    <div className="absolute top-0 bottom-0 w-0.5 bg-rose-500 z-30 pointer-events-none shadow-[0_0_10px_rgba(244,63,94,0.8)]" style={{ left: `${currentPercent}%` }}>
                                        <div className="absolute -top-1 -left-1 sm:-left-1.5 w-2.5 h-2.5 sm:w-3.5 sm:h-3.5 bg-rose-500 rounded-full border-2 border-white pointer-events-none"></div>
                                    </div>
                                    
                                    {/* Custom Pointer-driven Trimmer Handle UI */}
                                    <div className={`absolute top-0 bottom-0 border-x-2 border-indigo-500 z-10 ${ignoreTrim ? 'bg-indigo-500/5' : 'bg-indigo-500/20'}`} style={{ left: `${leftPercent}%`, width: `${widthPercent}%` }}>
                                         <div 
                                            onPointerDown={(e) => handleTrimPointerDown(e, 'start')}
                                            className="absolute -left-4 top-1/2 -translate-y-1/2 w-8 h-10 bg-indigo-500 rounded-md flex items-center justify-center cursor-ew-resize shadow-md touch-none hover:bg-indigo-400 active:bg-indigo-600 transition-colors z-20"
                                         >
                                            <div className="w-0.5 h-4 bg-white/60 rounded-full pointer-events-none"></div>
                                         </div>
                                         <div 
                                            onPointerDown={(e) => handleTrimPointerDown(e, 'end')}
                                            className="absolute -right-4 top-1/2 -translate-y-1/2 w-8 h-10 bg-indigo-500 rounded-md flex items-center justify-center cursor-ew-resize shadow-md touch-none hover:bg-indigo-400 active:bg-indigo-600 transition-colors z-20"
                                         >
                                            <div className="w-0.5 h-4 bg-white/60 rounded-full pointer-events-none"></div>
                                         </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        {/* RIGHT SIDEBAR (Properties & Modules) */}
                        <aside className={`absolute lg:relative inset-y-0 right-0 z-40 w-80 max-w-[85vw] bg-zinc-900/95 backdrop-blur-xl border-l border-white/5 flex flex-col shrink-0 transform transition-transform duration-300 ease-in-out shadow-2xl lg:shadow-none ${
                            mobilePanel === 'right' || mobilePanel === 'modules' ? 'translate-x-0' : 'translate-x-full lg:translate-x-0'
                        }`}>
                            {/* Panel Tab Navigation */}
                            <div className="flex border-b border-white/5 bg-zinc-950/50 shrink-0 z-20">
                                <button 
                                    onClick={() => { setRightTab('properties'); setMobilePanel('right'); }} 
                                    className={`flex-1 p-4 text-xs font-bold uppercase tracking-widest flex items-center justify-center transition-colors ${rightTab === 'properties' ? 'text-indigo-400 border-b-2 border-indigo-500' : 'text-zinc-500 hover:text-zinc-300'}`}
                                >
                                    <Settings className="w-4 h-4 mr-2" /> Properties
                                </button>
                                <button 
                                    onClick={() => { setRightTab('modules'); setMobilePanel('modules'); }} 
                                    className={`flex-1 p-4 text-xs font-bold uppercase tracking-widest flex items-center justify-center transition-colors ${rightTab === 'modules' ? 'text-indigo-400 border-b-2 border-indigo-500' : 'text-zinc-500 hover:text-zinc-300'}`}
                                >
                                    <Puzzle className="w-4 h-4 mr-2" /> Modules
                                </button>
                                <button className="lg:hidden p-4 text-zinc-400 hover:text-white" onClick={() => setMobilePanel('none')}><X className="w-5 h-5" /></button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto custom-scrollbar pb-24 lg:pb-6 relative flex flex-col">
                                
                                {/* PROPERTIES TAB */}
                                {rightTab === 'properties' && (
                                    <>
                                        {!selectedEl ? (
                                            <div className="p-6 text-center flex flex-col items-center text-zinc-500">
                                                <div className="w-16 h-16 rounded-2xl bg-zinc-800/50 flex items-center justify-center mb-4">
                                                        <Layers className="w-8 h-8 opacity-50" />
                                                </div>
                                                <p className="text-sm font-medium">Select an element to configure it.</p>
                                                
                                                <div className="mt-8 w-full text-left bg-zinc-950/50 p-4 rounded-xl border border-white/5 mb-6">
                                                    <h3 className="text-[10px] font-bold text-zinc-400 uppercase tracking-widest mb-3">Scene Globals</h3>
                                                    <label className="block text-xs text-zinc-500 mb-1.5 font-medium">Background Color</label>
                                                    <div className="flex items-center space-x-2 mb-6">
                                                        <input type="color" value={sceneRef.current.background} onChange={e => { sceneRef.current.background = e.target.value; forceUpdate(); }} className="w-10 h-10 rounded-lg border-0 cursor-pointer bg-transparent"/>
                                                        <input type="text" value={sceneRef.current.background} onChange={e => { sceneRef.current.background = e.target.value; forceUpdate(); }} className="flex-1 bg-zinc-900 border border-white/10 rounded-lg p-2.5 text-sm text-white uppercase font-mono shadow-inner focus:outline-none focus:border-indigo-500"/>
                                                    </div>

                                                    <h3 className="text-[10px] font-bold text-zinc-400 uppercase tracking-widest mb-3 border-t border-white/5 pt-4">Custom Templates</h3>
                                                    <div className="flex space-x-2 mb-4">
                                                        <input type="text" placeholder="Template Name" value={newTemplateName} onChange={e => setNewTemplateName(e.target.value)} className="flex-1 bg-zinc-900 border border-white/10 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
                                                        <button onClick={handleSaveCustomTemplate} className="bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-lg transition-colors" title="Save Layout"><Save className="w-4 h-4" /></button>
                                                    </div>

                                                    {savedTemplates.length > 0 && (
                                                        <div className="space-y-2 mt-2">
                                                            <label className="block text-xs text-zinc-500 font-medium">My Saved Templates</label>
                                                            {savedTemplates.map(tmpl => (
                                                                <div key={tmpl.id} className="flex justify-between items-center bg-zinc-900 border border-white/5 p-2 rounded-lg">
                                                                    <button onClick={() => loadTemplate(tmpl)} className="flex-1 text-left text-xs text-zinc-300 hover:text-white truncate flex items-center">
                                                                        <LayoutTemplate className="w-3 h-3 mr-2 text-indigo-400" /> {tmpl.name}
                                                                    </button>
                                                                    <button onClick={() => deleteTemplate(tmpl.id)} className="p-1 text-zinc-500 hover:text-rose-400"><Trash2 className="w-3 h-3" /></button>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="p-4 space-y-5">
                                                <div className="bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs p-3 rounded-lg flex items-start">
                                                    <Monitor className="w-4 h-4 mr-2 shrink-0 mt-0.5" />
                                                    <p><strong>Inline editing active.</strong> Drag the element or use the offset corner handle to resize.</p>
                                                </div>

                                                {selectedEl.type === 'text' && (
                                                    <>
                                                        <div>
                                                            <label className="block text-xs text-zinc-400 mb-1.5 font-medium">Content</label>
                                                            <textarea value={selectedEl.text} onChange={e => updateElement(selectedEl.id, {text: e.target.value})} className="w-full bg-zinc-950 border border-white/10 rounded-xl p-3 text-sm text-white resize-none shadow-inner focus:outline-none focus:border-indigo-500 transition-colors" rows={3} />
                                                        </div>
                                                        <div>
                                                            <label className="block text-xs text-zinc-400 mb-1.5 font-medium flex justify-between"><span>Font Family</span></label>
                                                            <select value={selectedEl.font} onChange={e => { const font = e.target.value; saveFont(font); updateElement(selectedEl.id, {font}); }} className="w-full bg-zinc-950 border border-white/10 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                                                                {[...new Set([...POPULAR_FONTS, ...savedFonts])].map(f => (<option key={f} value={f} style={{fontFamily: f}}>{f}</option>))}
                                                            </select>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-3">
                                                            <div>
                                                                <label className="block text-xs text-zinc-400 mb-1.5 font-medium">Font Weight</label>
                                                                <select value={selectedEl.weight} onChange={e => updateElement(selectedEl.id, {weight: e.target.value})} className="w-full bg-zinc-950 border border-white/10 rounded-xl p-2.5 text-sm text-white">
                                                                    <option value="400">Regular</option><option value="600">Semi-Bold</option><option value="800">Extra-Bold</option>
                                                                </select>
                                                            </div>
                                                            <div>
                                                                <label className="block text-xs text-zinc-400 mb-1.5 font-medium">Alignment</label>
                                                                <select value={selectedEl.align} onChange={e => updateElement(selectedEl.id, {align: e.target.value})} className="w-full bg-zinc-950 border border-white/10 rounded-xl p-2.5 text-sm text-white">
                                                                    <option value="left">Left</option><option value="center">Center</option><option value="right">Right</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </>
                                                )}

                                                {selectedEl.type === 'image' && (
                                                    <>
                                                        <div>
                                                            <label className="block text-xs text-zinc-400 mb-1.5 font-medium">Image Source</label>
                                                            <select 
                                                                value={selectedEl.sourceType || 'custom'} 
                                                                onChange={e => {
                                                                    const type = e.target.value;
                                                                    let newSrc = selectedEl.src;
                                                                    if (type === 'episode' && selectedEpisode?.image) newSrc = selectedEpisode.image;
                                                                    if (type === 'show' && feedData?.image) newSrc = feedData.image;
                                                                    updateElement(selectedEl.id, { sourceType: type, src: newSrc });
                                                                }}
                                                                className="w-full bg-zinc-950 border border-white/10 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 mb-3"
                                                            >
                                                                <option value="episode">Episode Cover Art</option>
                                                                <option value="show">Podcast/Show Cover Art</option>
                                                                <option value="custom">Custom URL</option>
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="block text-xs text-zinc-400 mb-1.5 font-medium">Image URL</label>
                                                            <input type="text" value={selectedEl.src} onChange={e => updateElement(selectedEl.id, {src: e.target.value, sourceType: 'custom'})} className={`w-full bg-zinc-950 border border-white/10 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-opacity ${selectedEl.sourceType !== 'custom' ? 'opacity-50' : ''}`} placeholder="https://..." />
                                                        </div>
                                                        <div>
                                                            <label className="block text-xs text-zinc-400 mb-1.5 font-medium flex justify-between"><span>Corner Radius</span><span className="text-zinc-500 font-mono">{selectedEl.radius}px</span></label>
                                                            <input type="range" min="0" max="1000" value={selectedEl.radius || 0} onChange={e => updateElement(selectedEl.id, {radius: Number(e.target.value)})} className="w-full accent-indigo-500" />
                                                        </div>
                                                    </>
                                                )}

                                                {selectedEl.type === 'waveform' && (
                                                    <div>
                                                        <label className="block text-xs text-zinc-400 mb-1.5 font-medium">Visual Style</label>
                                                        <select value={selectedEl.style} onChange={e => updateElement(selectedEl.id, {style: e.target.value})} className="w-full bg-zinc-950 border border-white/10 rounded-xl p-2.5 text-sm text-white">
                                                            <option value="bars">Classic Bottom Bars</option>
                                                            <option value="bars_mirrored">Center Mirrored Bars</option>
                                                            <option value="circle">Radial Circle</option>
                                                            <option value="line">Pulse Line</option>
                                                            {/* Dynamic Extension Waveforms */}
                                                            {Object.keys(window.AudiogramAPI?.waveforms || {}).map(k => (
                                                                <option key={k} value={k}>{k}</option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                )}

                                                {(selectedEl.type === 'text' || selectedEl.type === 'waveform' || selectedEl.type === 'progress') && (
                                                    <div>
                                                        <label className="block text-xs text-zinc-400 mb-1.5 font-medium">Color</label>
                                                        <div className="flex items-center space-x-2">
                                                            <input type="color" value={selectedEl.color} onChange={e => updateElement(selectedEl.id, {color: e.target.value})} className="w-10 h-10 rounded-lg border-0 cursor-pointer bg-transparent"/>
                                                            <input type="text" value={selectedEl.color} onChange={e => updateElement(selectedEl.id, {color: e.target.value})} className="flex-1 bg-zinc-950 border border-white/10 rounded-xl p-2.5 text-sm text-white uppercase font-mono shadow-inner"/>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                        
                                        <div className="border-t border-white/5 bg-zinc-950 shrink-0 flex flex-col mt-auto">
                                            <div className="p-3 px-4 border-b border-white/5 flex justify-between items-center bg-zinc-900/50">
                                                <h2 className="text-xs font-bold uppercase tracking-widest text-zinc-400 flex items-center">
                                                    <Layers className="w-4 h-4 mr-2" /> Layers
                                                </h2>
                                            </div>
                                            <div className="p-2 space-y-1">
                                                 {layersUI.map((el) => (
                                                     <div key={el.id} onClick={() => setSelectedId(el.id)} className={`flex items-center justify-between p-2 rounded-lg text-sm cursor-pointer border transition-colors ${selectedId === el.id ? 'bg-indigo-600/20 border-indigo-500/50 text-white' : 'bg-zinc-900 border-white/5 text-zinc-400 hover:bg-zinc-800'}`}>
                                                         <div className="flex items-center space-x-3 truncate">
                                                                <div className="text-zinc-500">
                                                                    {el.type === 'text' && <Type className="w-4 h-4" />}
                                                                    {el.type === 'image' && <ImageIcon className="w-4 h-4" />}
                                                                    {el.type === 'waveform' && <Activity className="w-4 h-4" />}
                                                                    {el.type === 'progress' && <Move className="w-4 h-4" />}
                                                                </div>
                                                                <span className="truncate font-medium text-xs">{el.text || el.id.split('-')[0].toUpperCase()}</span>
                                                         </div>
                                                         <div className="flex items-center space-x-1">
                                                             <div className="flex flex-col mr-2">
                                                                 <button onClick={(e) => { e.stopPropagation(); moveLayer(el.originalIndex, 'up'); }} disabled={el.originalIndex === sceneRef.current.elements.length - 1} className="text-zinc-500 hover:text-white disabled:opacity-30"><ChevronUp className="w-3 h-3"/></button>
                                                                 <button onClick={(e) => { e.stopPropagation(); moveLayer(el.originalIndex, 'down'); }} disabled={el.originalIndex === 0} className="text-zinc-500 hover:text-white disabled:opacity-30"><ChevronDown className="w-3 h-3"/></button>
                                                             </div>
                                                             <button onClick={(e) => { e.stopPropagation(); removeElement(el.id); }} className="p-1.5 hover:bg-rose-500/20 text-zinc-500 hover:text-rose-400 rounded-md transition-colors"><Trash2 className="w-3.5 h-3.5" /></button>
                                                         </div>
                                                     </div>
                                                 ))}
                                                 {layersUI.length === 0 && <div className="text-center p-4 text-xs text-zinc-600 font-medium mt-4">No layers in scene.</div>}
                                            </div>
                                        </div>
                                    </>
                                )}

                                {/* MODULES TAB */}
                                {rightTab === 'modules' && (
                                    <div className="p-6 flex flex-col space-y-6">
                                        <div className="bg-gradient-to-br from-indigo-500/10 to-purple-600/10 border border-indigo-500/20 rounded-xl p-5 shadow-inner">
                                            <div className="flex items-center space-x-3 mb-3">
                                                <Plug className="w-6 h-6 text-indigo-400" />
                                                <h3 className="text-sm font-bold text-white uppercase tracking-widest">Extension Ecosystem</h3>
                                            </div>
                                            <p className="text-xs text-zinc-300 leading-relaxed">
                                                Modules instantly expand Audiogram Pro. They can inject new <strong>Waveform Visualizers</strong>, add custom <strong>Editing Tools</strong>, or automate layouts without requiring a page refresh. All modules are executed client-side and saved locally.
                                            </p>
                                        </div>

                                        <button 
                                            onClick={fetchExtensions}
                                            disabled={extensionLoading}
                                            className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold py-3 rounded-xl transition-all shadow-[0_0_15px_rgba(79,70,229,0.3)] flex items-center justify-center uppercase tracking-widest text-xs"
                                        >
                                            {extensionLoading ? <RefreshCw className="w-4 h-4 animate-spin mr-2" /> : <DownloadCloud className="w-4 h-4 mr-2" />}
                                            {extensionLoading ? 'Fetching Repository...' : 'Fetch Core Modules'}
                                        </button>

                                        <div className="pt-4 border-t border-white/5">
                                            <h4 className="text-[10px] font-bold uppercase tracking-widest text-zinc-500 mb-4">Installed Modules ({installedExtensions.length})</h4>
                                            
                                            {installedExtensions.length === 0 && (
                                                <div className="text-center py-8 border border-dashed border-white/10 rounded-xl">
                                                    <Puzzle className="w-8 h-8 text-zinc-700 mx-auto mb-2" />
                                                    <p className="text-xs font-medium text-zinc-500">No extensions installed.</p>
                                                </div>
                                            )}

                                            <div className="space-y-3">
                                                {installedExtensions.map(ext => (
                                                    <div key={ext.id} className="bg-zinc-950 border border-white/5 rounded-xl p-4 shadow-inner relative group">
                                                        <div className="flex justify-between items-start mb-2">
                                                            <h5 className="text-sm font-bold text-white">{ext.name} <span className="text-[9px] text-zinc-500 ml-1 font-mono bg-zinc-900 px-1 py-0.5 rounded">v{ext.version}</span></h5>
                                                            <button 
                                                                onClick={() => handleRemoveExtension(ext.id)}
                                                                className="text-zinc-500 hover:text-rose-400 p-1 opacity-0 group-hover:opacity-100 transition-opacity"
                                                                title="Remove Module"
                                                            >
                                                                <Trash2 className="w-4 h-4" />
                                                            </button>
                                                        </div>
                                                        <p className="text-xs text-zinc-400 leading-relaxed mb-3">{ext.description}</p>
                                                        <div className="flex items-center text-[10px] text-zinc-600 font-mono">
                                                            <span className="bg-zinc-900 px-2 py-1 rounded">By {ext.developer}</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>

                                            {blacklistedExtensions.length > 0 && (
                                                <button 
                                                    onClick={() => { clearExtensionBlacklist(); showToast("Blacklist cleared. You can now fetch all modules again.", "success"); }}
                                                    className="text-xs text-zinc-500 hover:text-indigo-400 mt-6 text-center w-full transition-colors flex items-center justify-center font-medium"
                                                >
                                                    Restore {blacklistedExtensions.length} hidden module(s)
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </aside>
                    </div>

                    {/* True Fixed Bottom Navigation Footer for Mobile */}
                    <div className="lg:hidden shrink-0 h-16 bg-zinc-950/95 backdrop-blur-xl border-t border-white/5 flex items-center justify-around z-50 px-2 relative">
                        <button onClick={() => setMobilePanel(p => p === 'left' ? 'none' : 'left')} className={`flex flex-col items-center justify-center w-14 h-12 rounded-xl transition-all ${mobilePanel === 'left' ? 'text-indigo-400 bg-indigo-500/10' : 'text-zinc-400 hover:text-white'}`}>
                            <ListMusic className="w-4 h-4 mb-0.5" />
                            <span className="text-[8px] font-bold uppercase tracking-widest">Source</span>
                        </button>
                        <button onClick={() => setMobilePanel(p => p === 'timeline' ? 'none' : 'timeline')} className={`flex flex-col items-center justify-center w-14 h-12 rounded-xl transition-all ${mobilePanel === 'timeline' ? 'text-indigo-400 bg-indigo-500/10' : 'text-zinc-400 hover:text-white'}`}>
                            <Music className="w-4 h-4 mb-0.5" />
                            <span className="text-[8px] font-bold uppercase tracking-widest">Trim</span>
                        </button>
                        <button onClick={() => { setRightTab('properties'); setMobilePanel(p => p === 'right' ? 'none' : 'right'); }} className={`flex flex-col items-center justify-center w-14 h-12 rounded-xl transition-all ${mobilePanel === 'right' && rightTab === 'properties' ? 'text-indigo-400 bg-indigo-500/10' : 'text-zinc-400 hover:text-white'}`}>
                            <Settings className="w-4 h-4 mb-0.5" />
                            <span className="text-[8px] font-bold uppercase tracking-widest">Edit</span>
                        </button>
                        <button onClick={() => { setRightTab('modules'); setMobilePanel(p => p === 'modules' ? 'none' : 'modules'); }} className={`flex flex-col items-center justify-center w-14 h-12 rounded-xl transition-all ${mobilePanel === 'modules' ? 'text-indigo-400 bg-indigo-500/10' : 'text-zinc-400 hover:text-white'}`}>
                            <Puzzle className="w-4 h-4 mb-0.5" />
                            <span className="text-[8px] font-bold uppercase tracking-widest">Mods</span>
                        </button>
                        <div className="w-px h-8 bg-white/10 mx-0.5"></div>
                        <button onClick={() => setMobilePanel('none')} className={`flex flex-col items-center justify-center w-14 h-12 rounded-xl transition-all ${mobilePanel === 'none' ? 'text-white bg-white/10' : 'text-zinc-400 hover:text-white'}`}>
                            <Monitor className="w-4 h-4 mb-0.5" />
                            <span className="text-[8px] font-bold uppercase tracking-widest">Canvas</span>
                        </button>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
