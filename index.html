    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useCallback, useMemo } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
            Play, Pause, Download, Type, Image as ImageIcon, Activity, 
            Settings, Search, Plus, Trash2, Maximize, RefreshCw, Radio, 
            Layers, LayoutTemplate, Link as LinkIcon, Move, ZoomIn,

        } from 'https://esm.sh/lucide-react@0.292.0';

        const TOOL_VERSION = "0.9.2";

        // --- GLOBAL HOT-SWAP EXTENSION API ---
        if (!window.AudiogramAPI) {
            window.AudiogramAPI = {
                waveforms: {},
                tools: {},
                _exts: {},
                state: {}, // Exposes current episode data to extensions securely
                register: (id, init, teardown) => {
                    window.AudiogramAPI._exts[id] = teardown;
                    if(init) init(window.AudiogramAPI);
                    window.dispatchEvent(new Event('audiogram:ext:update'));
                },
                unregister: (id) => {
                    if(window.AudiogramAPI._exts[id]) window.AudiogramAPI._exts[id](window.AudiogramAPI);
                    delete window.AudiogramAPI._exts[id];
                    window.dispatchEvent(new Event('audiogram:ext:update'));
                },
                addWaveform: (name, drawFn) => {
                    window.AudiogramAPI.waveforms[name] = drawFn;
                    window.dispatchEvent(new Event('audiogram:ext:update'));
                },
                removeWaveform: (name) => {
                    delete window.AudiogramAPI.waveforms[name];
                    window.dispatchEvent(new Event('audiogram:ext:update'));
                }
            };
        }

        // Parse Extension Metadata formatting
        const parseExtension = (code) => {
            const nameMatch = code.match(/@name\s+(.*)/);
            const descMatch = code.match(/@description\s+(.*)/);
            const devMatch = code.match(/@developer\s+(.*)/);
            const verMatch = code.match(/@version\s+(.*)/);

            if (!nameMatch) throw new Error("Invalid Extension format: missing @name");
            
            return {
                id: nameMatch[1].trim().replace(/\s+/g, '_').toLowerCase(),
                name: nameMatch[1].trim(),
                description: descMatch ? descMatch[1].trim() : 'No description provided.',
                developer: devMatch ? devMatch[1].trim() : 'Unknown Developer',
                version: verMatch ? verMatch[1].trim() : '1.0.0',
                code: code
            };
        };

        // --- MEDIA PROXY (Images only, Audio goes direct) ---
        const PROXY_URL = 'https://api.allorigins.win/raw?url=';
        const CORS_MEDIA_PROXY = (url) => `${PROXY_URL}${encodeURIComponent(url)}`;

        // --- RSS PROXY API (Lovable Endpoint) ---
        const PROXY_BASE = "https://rss-proxy.lovable.app/api/public/fetch-rss";

        const fetchPodcastFeed = async (feedUrl, licenseKey) => {
            const url = new URL(PROXY_BASE);
            url.searchParams.set("url", feedUrl);
            if (licenseKey) url.searchParams.set("key", licenseKey);

            const res = await fetch(url.toString());

            if (res.status === 402) {
                const data = await res.json();
                throw { code: "LIMIT_REACHED", message: data.message || "Free tier exhausted" };
            }

            if (res.status === 401) {
                const data = await res.json();
                throw new Error(data.message || "Invalid license key");
            }

            if (!res.ok) {
                throw new Error(`RSS Proxy error: HTTP ${res.status}`);
            }

            return await res.text();
        };

        const POPULAR_FONTS = [
            'Inter', 'Roboto', 'Oswald', 'Montserrat', 'Bebas Neue', 
            'Playfair Display', 'Poppins', 'Lato', 'Raleway', 'Anton'
        ];

        const FORMATS = {
            SQUARE: { name: 'Square', width: 1080, height: 1080, icon: Square },
            PORTRAIT: { name: 'Portrait', width: 1080, height: 1920, icon: Smartphone },
            LANDSCAPE: { name: 'Landscape', width: 1920, height: 1080, icon: Monitor },
        };

        const injectFont = (fontName) => {
            if (document.getElementById(`font-${fontName}`)) return;
            const link = document.createElement('link');
            link.id = `font-${fontName}`;
            link.rel = 'stylesheet';
            link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/ /g, '+')}:wght@400;600;800&display=swap`;
            document.head.appendChild(link);
        };

        const drawRoundedRect = (ctx, x, y, width, height, radius) => {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        };

        // Highly Precise Text Wrapper for Perfect AABB Centering
        const wrapText = (ctx, text, x, y, maxWidth, lineHeight, align) => {
            const words = text.split(' ');
            const lines = [];
            let line = '';
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(line.trim());
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line.trim());

            const totalHeight = lines.length * lineHeight;
            let currentY = y; 

            ctx.textAlign = align;
            ctx.textBaseline = 'top';
            
            let drawX = x;
            if (align === 'center') drawX = x + (maxWidth / 2);
            if (align === 'right') drawX = x + maxWidth;

            lines.forEach(l => {
                ctx.fillText(l, drawX, currentY);
                currentY += lineHeight;
            });

            return totalHeight; 
        };

        const useIndexedDB = () => {
            const [savedFonts, setSavedFonts] = useState([]);
            const [savedTemplates, setSavedTemplates] = useState([]);
            const [recentFeeds, setRecentFeeds] = useState([]);
            const [installedExtensions, setInstalledExtensions] = useState([]);
            const [blacklistedExtensions, setBlacklistedExtensions] = useState([]);
            const [dbInstance, setDbInstance] = useState(null);
            
            useEffect(() => {
                const request = indexedDB.open('AudiogramProDB', 4);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('fonts')) db.createObjectStore('fonts', { keyPath: 'name' });
                    if (!db.objectStoreNames.contains('history')) db.createObjectStore('history', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('templates')) db.createObjectStore('templates', { keyPath: 'id', autoIncrement: true });
                    if (!db.objectStoreNames.contains('extensions')) db.createObjectStore('extensions', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('blacklist')) db.createObjectStore('blacklist', { keyPath: 'id' });
                };
                request.onsuccess = (e) => {
                    const db = e.target.result;
                    setDbInstance(db);
                    
                    db.transaction('fonts', 'readonly').objectStore('fonts').getAll().onsuccess = (ev) => {
                        const fonts = ev.target.result.map(f => f.name);
                        setSavedFonts(fonts.length ? fonts : ['Inter']);
                        fonts.forEach(injectFont);
                    };

                    db.transaction('templates', 'readonly').objectStore('templates').getAll().onsuccess = (ev) => {
                        setSavedTemplates(ev.target.result);
                    };

                    db.transaction('history', 'readonly').objectStore('history').getAll().onsuccess = (ev) => {
                        const historyList = ev.target.result.sort((a, b) => b.timestamp - a.timestamp);
                        setRecentFeeds(historyList);
                    };

                    db.transaction('blacklist', 'readonly').objectStore('blacklist').getAll().onsuccess = (ev) => {
                        setBlacklistedExtensions(ev.target.result.map(b => b.id));
                    };

                    db.transaction('extensions', 'readonly').objectStore('extensions').getAll().onsuccess = (ev) => {
                        const exts = ev.target.result;
                        setInstalledExtensions(exts);
                        // Auto-load installed extensions silently on boot
                        exts.forEach(ext => {
                            try {
                                const fn = new Function('AudiogramAPI', ext.code + `\n//# sourceURL=ext-${ext.id}.js`);
                                fn(window.AudiogramAPI);
                            } catch(err) {
                                console.error(`Failed to load extension ${ext.name}:`, err);
                            }
                        });
                    };
                };
            }, []);

            const saveFont = useCallback((fontName) => {
                if (savedFonts.includes(fontName) || !dbInstance) return;
                const tx = dbInstance.transaction('fonts', 'readwrite');
                tx.objectStore('fonts').put({ name: fontName });
                setSavedFonts(prev => [...new Set([...prev, fontName])]);
                injectFont(fontName);
            }, [dbInstance, savedFonts]);

            const saveHistory = useCallback((feedUrl, episodeTitle, showTitle, imageUrl) => {
                if (!feedUrl || !dbInstance) return;
                const tx = dbInstance.transaction('history', 'readwrite');
                const newRecord = { id: feedUrl, feedUrl, episodeTitle, showTitle, imageUrl, timestamp: Date.now() };
                tx.objectStore('history').put(newRecord);
                
                setRecentFeeds(prev => {
                    const filtered = prev.filter(f => f.id !== feedUrl);
                    return [newRecord, ...filtered];
                });
            }, [dbInstance]);

            const getHistory = useCallback(() => {
                return new Promise((resolve) => {
                    if (!dbInstance) resolve(null);
                    const tx = dbInstance.transaction('history', 'readonly');
                    const req = tx.objectStore('history').getAll();
                    req.onsuccess = () => {
                        const list = req.result.sort((a, b) => b.timestamp - a.timestamp);
                        resolve(list.length > 0 ? list[0] : null); 
                    };
                    req.onerror = () => resolve(null);
                });
            }, [dbInstance]);

            const saveTemplate = useCallback((name, sceneData) => {
                if (!dbInstance) return;
                const newTemplate = { name, timestamp: Date.now(), ...sceneData };
                const tx = dbInstance.transaction('templates', 'readwrite');
                const req = tx.objectStore('templates').add(newTemplate);
                req.onsuccess = (e) => {
                    setSavedTemplates(prev => [...prev, { ...newTemplate, id: e.target.result }]);
                };
            }, [dbInstance]);

            const deleteTemplate = useCallback((id) => {
                if (!dbInstance) return;
                const tx = dbInstance.transaction('templates', 'readwrite');
                tx.objectStore('templates').delete(id);
                setSavedTemplates(prev => prev.filter(t => t.id !== id));
            }, [dbInstance]);

            const saveExtension = useCallback((extData) => {
                if (!dbInstance) return;
                const tx = dbInstance.transaction('extensions', 'readwrite');
                tx.objectStore('extensions').put(extData);
                setInstalledExtensions(prev => {
                    const filtered = prev.filter(e => e.id !== extData.id);
                    return [...filtered, extData];
                });
            }, [dbInstance]);

            const deleteExtensionDb = useCallback((id) => {
                if (!dbInstance) return;
                const tx = dbInstance.transaction('extensions', 'readwrite');
                tx.objectStore('extensions').delete(id);
                setInstalledExtensions(prev => prev.filter(e => e.id !== id));
            }, [dbInstance]);

            const addExtensionToBlacklist = useCallback((id) => {
                if (!dbInstance) return;
                const tx = dbInstance.transaction('blacklist', 'readwrite');
                tx.objectStore('blacklist').put({ id });
                setBlacklistedExtensions(prev => [...new Set([...prev, id])]);
            }, [dbInstance]);

            const clearExtensionBlacklist = useCallback(() => {
                if (!dbInstance) return;
                const tx = dbInstance.transaction('blacklist', 'readwrite');
                tx.objectStore('blacklist').clear();
                setBlacklistedExtensions([]);
            }, [dbInstance]);

            return { savedFonts, saveFont, saveHistory, getHistory, recentFeeds, savedTemplates, saveTemplate, deleteTemplate, installedExtensions, saveExtension, deleteExtensionDb, blacklistedExtensions, addExtensionToBlacklist, clearExtensionBlacklist };
        };

        function App() {
            // --- Toast Notification System ---
            const [toast, setToast] = useState(null);
            const showToast = useCallback((msg, type = 'error') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 5500);
            }, []);

            const [rssUrl, setRssUrl] = useState('');
            const [licenseKey, setLicenseKey] = useState(() => localStorage.getItem("rssproxy_key") || '');
            const [feedData, setFeedData] = useState(null);
            const [episodes, setEpisodes] = useState([]);
            const [selectedEpisode, setSelectedEpisode] = useState(null);
            const [loading, setLoading] = useState(false);
            const [extensionLoading, setExtensionLoading] = useState(false);
            
            // Audio State
            const audioRef = useRef(new Audio());
            const audioCtxRef = useRef(null);
            const analyserRef = useRef(null);
            const mediaSourceRef = useRef(null);
            const destRef = useRef(null);
            
            const [isPlaying, setIsPlaying] = useState(false);
            const [audioLoading, setAudioLoading] = useState(false);
            const [audioError, setAudioError] = useState(null);
            
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(1);
            const [trimStart, setTrimStart] = useState(0);
            const [trimEnd, setTrimEnd] = useState(30);
            const [ignoreTrim, setIgnoreTrim] = useState(false); 
            const [episodeSoundbites, setEpisodeSoundbites] = useState([]);

            // Expose active state to external Extensions dynamically
            useEffect(() => {
                window.AudiogramAPI.state = {
                    selectedEpisode,
                    feedData,
                    currentTime,
                    duration,
                    trimStart,
                    trimEnd
                };
            }, [selectedEpisode, feedData, currentTime, duration, trimStart, trimEnd]);

            const canvasRef = useRef(null);
            const sceneRef = useRef({
                width: 1080, height: 1080, background: '#09090b', format: 'SQUARE',
                elements: [
                    { id: 'cover', type: 'image', x: 240, y: 100, w: 600, h: 600, radius: 40, src: '' },
                    { id: 'wave', type: 'waveform', x: 140, y: 740, w: 800, h: 100, color: '#6366f1', style: 'bars' },
                    { id: 'show', type: 'text', x: 140, y: 860, w: 800, h: 40, text: 'Podcast Name', font: 'Inter', size: 32, color: '#a1a1aa', align: 'center', weight: '600' },
                    { id: 'title', type: 'text', x: 140, y: 910, w: 800, h: 100, text: 'Episode Title', font: 'Inter', size: 48, color: '#ffffff', align: 'center', weight: '800' }
                ]
            });
            const [currentFormat, setCurrentFormat] = useState('SQUARE');
            const [uiState, setUiState] = useState({ tick: 0 }); 
            const forceUpdate = () => setUiState(s => ({ tick: s.tick + 1 }));
            
            const [selectedId, setSelectedId] = useState(null);
            const [interactionState, setInteractionState] = useState({ type: null });
            
            const [isExporting, setIsExporting] = useState(false);
            const mediaRecorderRef = useRef(null);
            const chunksRef = useRef([]);

            // Navigation state
            const [mobilePanel, setMobilePanel] = useState('none'); 
            const [rightTab, setRightTab] = useState('properties'); // 'properties' or 'modules'
            const [welcomeModal, setWelcomeModal] = useState(null);
            const [limitModal, setLimitModal] = useState(null);
            const [isSoundbiteModalOpen, setIsSoundbiteModalOpen] = useState(false);
            const [newTemplateName, setNewTemplateName] = useState('');

            // Custom Trimmer State
            const trimmerRef = useRef(null);
            const [trimInteraction, setTrimInteraction] = useState(null);

            const { savedFonts, saveFont, saveHistory, getHistory, recentFeeds, savedTemplates, saveTemplate, deleteTemplate, installedExtensions, saveExtension, deleteExtensionDb, blacklistedExtensions, addExtensionToBlacklist, clearExtensionBlacklist } = useIndexedDB();

            // Re-render when global Extension API updates
            useEffect(() => {
                const handleExtUpdate = () => forceUpdate();
                window.addEventListener('audiogram:ext:update', handleExtUpdate);
                return () => window.removeEventListener('audiogram:ext:update', handleExtUpdate);
            }, []);

            useEffect(() => {
                const handleContextMenu = (e) => e.preventDefault();
                const handleKeyDown = (e) => {
                    if (e.key === 'F12' || 
                        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
                        (e.ctrlKey && (e.key === 'U' || e.key === 'u'))) {
                        e.preventDefault();
                        return false;
                    }
                };
                
                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('keydown', handleKeyDown);
                
                return () => {
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('keydown', handleKeyDown);
                };
            }, []);

            const hasCheckedHistory = useRef(false);
            useEffect(() => {
                if (hasCheckedHistory.current) return;
                
                const checkBackgroundHistory = async () => {
                    const hist = await getHistory();
                    if (hist && hist.feedUrl) {
                        try {
                            const text = await fetchPodcastFeed(hist.feedUrl, licenseKey);
                            const parser = new DOMParser();
                            const xml = parser.parseFromString(text, 'text/xml');
                            
                            const items = Array.from(xml.querySelectorAll('item')).filter(item => item.querySelector('enclosure')?.getAttribute('url'));
                            
                            if (items.length > 0) {
                                const latestEpTitle = items[0].querySelector('title')?.textContent;
                                const isNew = latestEpTitle !== hist.episodeTitle;
                                
                                setWelcomeModal({
                                    showTitle: hist.showTitle,
                                    feedUrl: hist.feedUrl,
                                    latestEpTitle: latestEpTitle,
                                    isNew: isNew
                                });
                            }
                        } catch (e) {
                            console.error("Silent history check failed.");
                        }
                    }
                };
                
                hasCheckedHistory.current = true;
                setTimeout(() => checkBackgroundHistory(), 1000);
            }, [licenseKey, getHistory]);

            const handleSaveLicense = (key) => {
                setLicenseKey(key);
                localStorage.setItem("rssproxy_key", key);
            };

            const fetchRSS = async (urlToFetch = rssUrl) => {
                if (!urlToFetch) return;
                setLoading(true);
                setRssUrl(urlToFetch); 
                try {
                    const text = await fetchPodcastFeed(urlToFetch, licenseKey);
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text, 'text/xml');
                    
                    // Robust XML Image Extraction for both Show and Episode covers
                    const extractImage = (node) => {
                        let img = node.getElementsByTagName('itunes:image')[0];
                        if (img && img.getAttribute('href')) return img.getAttribute('href');
                        img = Array.from(node.children).find(c => c.tagName.toLowerCase() === 'itunes:image');
                        if (img && img.getAttribute('href')) return img.getAttribute('href');
                        const urlNode = node.querySelector('image > url');
                        if (urlNode && urlNode.textContent) return urlNode.textContent.trim();
                        return null;
                    };

                    const channel = xml.querySelector('channel');
                    const showTitle = channel.querySelector('title')?.textContent;
                    const showImage = extractImage(channel);
                    
                    const items = Array.from(xml.querySelectorAll('item')).map(item => {
                        let parsedSoundbites = [];
                        let sbs = Array.from(item.getElementsByTagName('podcast:soundbite'));
                        if (sbs.length === 0) sbs = Array.from(item.getElementsByTagName('soundbite')); 
                        
                        parsedSoundbites = sbs.map((node, idx) => ({
                            id: idx,
                            label: node.textContent?.trim() || `Soundbite ${idx + 1}`,
                            start: parseFloat(node.getAttribute('startTime')) || 0,
                            end: (parseFloat(node.getAttribute('startTime')) || 0) + (parseFloat(node.getAttribute('duration')) || 0)
                        }));

                        // Extract episode-specific image, fallback to show image if missing
                        const epImage = extractImage(item) || showImage;

                        return {
                            title: item.querySelector('title')?.textContent,
                            audioUrl: item.querySelector('enclosure')?.getAttribute('url'),
                            image: epImage,
                            soundbites: parsedSoundbites
                        };
                    }).filter(i => i.audioUrl);

                    if (items.length === 0) {
                        showToast("No audio files found. Please provide an Audio Podcast RSS feed.", "error");
                        setLoading(false);
                        return;
                    }

                    setFeedData({ title: showTitle, image: showImage });
                    setEpisodes(items);
                    if (items.length > 0) selectEpisode(items[0], showTitle, showImage);
                } catch (e) {
                    if (e.code === "LIMIT_REACHED") {
                        setLimitModal(e.message);
                    } else {
                        showToast(e.message || "Failed to parse RSS feed. It may be private or invalid.", "error");
                    }
                }
                setLoading(false);
            };

            const loadAudioFile = (url) => {
                setAudioLoading(true);
                setAudioError(null);
                
                const audio = audioRef.current;
                audio.pause();
                audio.src = ''; 
                audio.oncanplay = null;
                audio.onerror = null;
                audio.crossOrigin = "anonymous"; // Essential for AnalyserNode
                
                audio.oncanplay = () => {
                    setAudioLoading(false);
                    setAudioError(null);
                };
                
                audio.onerror = (e) => {
                    console.error("Audio Load Error:", e);
                    setAudioLoading(false);
                    setAudioError("CORS_BLOCKED");
                    showToast("Podcast host blocked secure audio streaming (CORS). We cannot analyze the waveform.", "error");
                };
                
                audio.src = url;
                audio.load();
            };

            const selectEpisode = (ep, showTitle, overrideShowImage) => {
                const sImage = overrideShowImage || feedData?.image;
                setSelectedEpisode(ep);
                setEpisodeSoundbites(ep.soundbites || []);
                setIsPlaying(false);
                
                sceneRef.current.elements = sceneRef.current.elements.map(el => {
                    if (el.id === 'title') return { ...el, text: ep.title };
                    if (el.id === 'show') return { ...el, text: showTitle || 'Podcast Name' };
                    
                    if (el.type === 'image') {
                        let newSrc = el.src;
                        let st = el.sourceType;
                        // Map the default template 'cover' to the episode image automatically
                        if (el.id === 'cover' && !st) st = 'episode';

                        if (st === 'episode') newSrc = ep.image || sImage; // Use sImage as safety net
                        else if (st === 'show') newSrc = sImage;

                        return { ...el, src: newSrc || el.src, sourceType: st || 'custom' };
                    }
                    return el;
                });
                
                if (ep.image) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => forceUpdate();
                    img.onerror = () => {
                        // Fallback if proxy rejects image
                        if (img.src.includes('allorigins')) {
                            img.crossOrigin = '';
                            img.src = ep.image;
                        }
                    };
                    img.src = CORS_MEDIA_PROXY(ep.image);
                    img._srcUrl = ep.image;
                } else {
                    forceUpdate();
                }

                if (ep.audioUrl) {
                    loadAudioFile(ep.audioUrl);
                } else {
                    audioRef.current.src = '';
                    setDuration(1); 
                }
            };

            const initAudio = useCallback(() => {
                if (!audioCtxRef.current) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    audioCtxRef.current = new Ctx();
                    analyserRef.current = audioCtxRef.current.createAnalyser();
                    analyserRef.current.fftSize = 128;
                    
                    audioRef.current.crossOrigin = "anonymous";
                    mediaSourceRef.current = audioCtxRef.current.createMediaElementSource(audioRef.current);
                    destRef.current = audioCtxRef.current.createMediaStreamDestination();
                    
                    mediaSourceRef.current.connect(analyserRef.current);
                    analyserRef.current.connect(audioCtxRef.current.destination); 
                    analyserRef.current.connect(destRef.current); 
                }
            }, []);

            // Strict Audio Boundary Enforcement
            useEffect(() => {
                const audio = audioRef.current;
                const updateTime = () => {
                    setCurrentTime(audio.currentTime);
                    if (!ignoreTrim && audio.currentTime >= trimEnd && !audio.paused) {
                        audio.pause();
                        setIsPlaying(false);
                        audio.currentTime = trimStart; // Snap back to start
                    }
                };
                const updateDuration = () => {
                    const d = audio.duration && isFinite(audio.duration) && audio.duration > 1 ? audio.duration : 1;
                    setDuration(d);
                    if (trimEnd === 30 && d > 30) setTrimEnd(30);
                };
                
                audio.addEventListener('timeupdate', updateTime);
                audio.addEventListener('loadedmetadata', updateDuration);
                
                return () => {
                    audio.removeEventListener('timeupdate', updateTime);
                    audio.removeEventListener('loadedmetadata', updateDuration);
                };
            }, [trimEnd, trimStart, ignoreTrim]);

            const togglePlay = (forcePlay = false) => {

                    setIsPlaying(false);

                    if (!ignoreTrim && (currentTime >= trimEnd || currentTime < trimStart)) {
                        audioRef.current.currentTime = trimStart;

            const handleSoundbiteSelect = (start, end) => {

            // --- Hot-Swap Modules Execution Engine with Blacklisting ---
            const fetchExtensions = async () => {
                setExtensionLoading(true);
                try {
                    const res = await fetch("https://api.github.com/repos/F-O-R-G-E-Open-Source-Philanthropy/audiogram/contents/extensions");
                    if (!res.ok) throw new Error("Could not fetch extension directory. Check repository availability.");
                    
                    const files = await res.json();
                    let installedCount = 0;
                    let skippedCount = 0;

                    for (const file of files) {
                        if (file.name.endsWith('.js')) {
                            const codeRes = await fetch(file.download_url);
                            const code = await codeRes.text();
                            const extData = parseExtension(code);
                            
                            // Check if Blacklisted or Already Installed
                            if (blacklistedExtensions.includes(extData.id)) {
                                skippedCount++;
                            } else if (!installedExtensions.find(e => e.id === extData.id)) {
                                saveExtension(extData);
                                // Hot Execute Immediately
                                const fn = new Function('AudiogramAPI', extData.code + `\n//# sourceURL=ext-${extData.id}.js`);
                                fn(window.AudiogramAPI);
                                installedCount++;
                            }
                        }
                    }
                    if (installedCount > 0) {
                        showToast(`Successfully installed ${installedCount} core extensions!`, "success");
                    } else if (skippedCount > 0) {
                        showToast(`All available modules installed. (Skipped ${skippedCount} hidden modules).`, "success");
                    } else {
                        showToast("All available core extensions are already installed.", "success");
                    }

                }

            const handleRemoveExtension = (id) => {

                showToast("Extension securely removed and hidden from future updates.", "success");
            };

            const drawScene = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const scene = sceneRef.current;
                
                ctx.clearRect(0, 0, scene.width, scene.height);
                ctx.fillStyle = scene.background;
                ctx.fillRect(0, 0, scene.width, scene.height);

                scene.elements.forEach(el => {
                    ctx.save();
                    
                    if (el.type === 'text') {
                        ctx.font = `${el.weight || '600'} ${el.size}px "${el.font}"`;
                        ctx.fillStyle = el.color;
                        // Auto-calculate exact height required for perfect AABB matching
                        const exactHeight = wrapText(ctx, el.text, el.x, el.y, el.w, el.size * 1.2, el.align || 'center');
                        el.h = exactHeight; 
                    } 
                    else if (el.type === 'image' && el.src) {
                        if (!el._img || el._img._srcUrl !== el.src) {
                            const img = new Image();
                            img.crossOrigin = 'anonymous';
                            img.onload = () => forceUpdate();
                            img.onerror = () => {
                                if (img.src.includes('allorigins')) {
                                    img.crossOrigin = '';
                                    img.src = el.src;
                                }
                            };
                            img.src = CORS_MEDIA_PROXY(el.src);
                            el._img = img;
                            el._img._srcUrl = el.src;
                        }
                        if (el._img && el._img.complete) {
                            if (el.radius) {
                                drawRoundedRect(ctx, el.x, el.y, el.w, el.h, el.radius);
                                ctx.clip();
                            }
                            ctx.drawImage(el._img, el.x, el.y, el.w, el.h);
                        } else {
                            ctx.fillStyle = '#18181b'; 
                            if (el.radius) drawRoundedRect(ctx, el.x, el.y, el.w, el.h, el.radius);
                            ctx.fill();
                        }
                    }
                    else if (el.type === 'waveform') {
                        const dataArray = new Uint8Array(analyserRef.current ? analyserRef.current.frequencyBinCount : 0);
                        if (analyserRef.current && isPlaying && !audioError) {
                            analyserRef.current.getByteFrequencyData(dataArray);
                        }
                        
                        ctx.fillStyle = el.color;
                        const bars = 40;
                        const barWidth = el.w / bars;
                        const gap = barWidth * 0.3;

                        // Master Full-Width FFT Fix: Create a mathematically smoothed curve mapping
                        // the bottom 45% of the FFT (where the voice lives) across ALL 40 bars.
                        const usableBins = analyserRef.current ? Math.floor(analyserRef.current.frequencyBinCount * 0.45) : bars;
                        const getVal = (i, totalBars) => {
                            const indexRatio = Math.pow(i / totalBars, 1.2);
                            const dataIndex = Math.floor(indexRatio * usableBins);
                            let val = dataArray[dataIndex] || 0;
                            // Add a tiny noise floor if playing so high-freq bars never look completely dead
                            if (isPlaying && !audioError && val < 4) val = 4 + Math.random() * 4; 
                            return val;
                        };
                        
                        // Hot-Swap Extension Rendering
                        if (window.AudiogramAPI?.waveforms[el.style]) {
                            window.AudiogramAPI.waveforms[el.style]({ ctx, el, dataArray, isPlaying, bars, barWidth, gap });
                        } 
                        else if (el.style === 'circle') {
                            const cx = el.x + el.w / 2;
                            const cy = el.y + el.h / 2;
                            const radius = Math.min(el.w, el.h) / 3;
                            for (let i = 0; i < bars; i++) {
                                const val = getVal(i, bars);
                                const heightPercent = val / 255;
                                const barHeight = Math.max((radius * 0.8) * heightPercent, 5); 
                                const angle = (i / bars) * Math.PI * 2;
                                ctx.save();
                                ctx.translate(cx, cy);
                                ctx.rotate(angle);
                                ctx.beginPath();
                                ctx.roundRect(-barWidth/2, radius, barWidth - gap, barHeight, (barWidth-gap)/2);
                                ctx.fill();
                                ctx.restore();
                            }
                        } else if (el.style === 'line') {
                            ctx.beginPath();
                            ctx.strokeStyle = el.color;
                            ctx.lineWidth = 4;
                            for (let i = 0; i < bars; i++) {
                                const val = getVal(i, bars);
                                const heightPercent = val / 255;
                                const yPos = el.y + el.h/2 - (el.h/2 * heightPercent);
                                const xPos = el.x + i * barWidth;
                                if (i === 0) ctx.moveTo(xPos, yPos);
                                else ctx.lineTo(xPos, yPos);
                            }
                            ctx.stroke();
                        } else {
                            for (let i = 0; i < bars; i++) {
                                const val = getVal(i, bars);
                                const heightPercent = val / 255;
                                const barHeight = Math.max(el.h * heightPercent, 6); 
                                ctx.beginPath();
                                if (el.style === 'bars_mirrored') {
                                    ctx.roundRect(el.x + i * barWidth, el.y + el.h/2 - barHeight/2, barWidth - gap, barHeight, (barWidth-gap)/2);
                                } else {
                                    ctx.roundRect(el.x + i * barWidth, el.y + el.h - barHeight, barWidth - gap, barHeight, (barWidth-gap)/2);
                                }
                                ctx.fill();
                            }
                        }
                    }
                    else if (el.type === 'progress') {
                        ctx.fillStyle = '#27272a'; 
                        if (el.radius) drawRoundedRect(ctx, el.x, el.y, el.w, el.h, el.radius);
                        ctx.fill();
                        ctx.clip();
                        
                        ctx.fillStyle = el.color;
                        let progress = 0;
                        if (duration > 1) {
                            if (ignoreTrim) {
                                progress = Math.max(0, Math.min(1, currentTime / duration));
                            } else if (trimEnd > trimStart) {
                                progress = Math.max(0, Math.min(1, (currentTime - trimStart) / (trimEnd - trimStart)));
                            }
                        }
                        ctx.fillRect(el.x, el.y, el.w * progress, el.h);
                    }

                    ctx.restore();
                    
                    if (selectedId === el.id && !isExporting) {
                        ctx.strokeStyle = '#6366f1'; 
                        ctx.lineWidth = 4;
                        ctx.strokeRect(el.x, el.y, el.w, el.h);
                        
                        // Physically Offset Resize Handle to perfectly prevent Drag Overlap
                        ctx.fillStyle = '#ffffff';
                        ctx.strokeStyle = '#6366f1';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(el.x + el.w + 14, el.y + el.h + 14, 16, 0, Math.PI*2);
                        ctx.fill();
                        ctx.stroke();
                    }
                });

            }, [isPlaying, currentTime, selectedId, trimStart, trimEnd, isExporting, audioError, ignoreTrim, uiState.tick]);

            useEffect(() => {
                let animationFrame;
                const renderLoop = () => {
                    drawScene();
                    animationFrame = requestAnimationFrame(renderLoop);
                };
                renderLoop();
                return () => cancelAnimationFrame(animationFrame);
            }, [drawScene]);

            const getPointerPos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const scaleX = canvasRef.current.width / rect.width;
                const scaleY = canvasRef.current.height / rect.height;
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            };

            const handlePointerDown = (e) => {
                if (isExporting) return;
                
                if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
                    audioCtxRef.current.resume();
                }

                const { x, y } = getPointerPos(e);
                
                // 1. Check Resize First (Absolute Priority, Strictly Outside Bounds)
                if (selectedId) {
                    const el = sceneRef.current.elements.find(e => e.id === selectedId);
                    if (el) {
                        const handleX = el.x + el.w + 14;
                        const handleY = el.y + el.h + 14;
                        // Massive 40px forgiving touch radius exclusively for the resize corner
                        if (Math.abs(x - handleX) <= 40 && Math.abs(y - handleY) <= 40) {
                            setInteractionState({ type: 'resizing', id: el.id, startX: x, startY: y, initW: el.w, initH: el.h });
                            e.target.setPointerCapture(e.pointerId);
                            return; // Stop execution here so it never hits the drag logic below
                        }
                    }
                }

                // 2. Check Dragging Second (Strictly inside boundaries)
                let clickedId = null;
                for (let i = sceneRef.current.elements.length - 1; i >= 0; i--) {
                    const el = sceneRef.current.elements[i];
                    if (x >= el.x && x <= el.x + el.w && y >= el.y && y <= el.y + el.h) {
                        clickedId = el.id;
                        setInteractionState({ type: 'dragging', id: el.id, startX: x, startY: y, initX: el.x, initY: el.y });
                        e.target.setPointerCapture(e.pointerId);
                        break;
                    }
                }
                
                setSelectedId(clickedId);
                if (!clickedId) forceUpdate();
            };

            const handlePointerMove = (e) => {
                if (interactionState.type === null || isExporting) return;
                const { x, y } = getPointerPos(e);
                const dx = x - interactionState.startX;
                const dy = y - interactionState.startY;
                
                const elIndex = sceneRef.current.elements.findIndex(el => el.id === interactionState.id);
                if (elIndex > -1) {
                    const el = sceneRef.current.elements[elIndex];
                    
                    if (interactionState.type === 'dragging') {
                        el.x = interactionState.initX + dx;
                        el.y = interactionState.initY + dy;
                    } else if (interactionState.type === 'resizing') {
                        el.w = Math.max(50, interactionState.initW + dx);
                        if (el.type !== 'text') {
                            el.h = Math.max(50, interactionState.initH + dy);
                        }
                    }
                    forceUpdate();
                }
            };

                setInteractionState({ type: null });
                if (e.target.hasPointerCapture(e.pointerId)) {

                }
            };

            // --- Mobile Forgiving Audio Trimmer & Playhead Logic ---
            const handleTrimPointerDown = (e, handle) => {
                e.preventDefault();
                e.stopPropagation();
                if (audioLoading || audioError) {
                    if (audioError) showToast("Audio blocked. Trimming disabled.", "error");
                    return;
                }
                setTrimInteraction(handle);
                e.target.setPointerCapture(e.pointerId);
            };

            const handleTrimPointerMove = useCallback((e) => {
                if (!trimInteraction || !trimmerRef.current || duration <= 1) return;
                const rect = trimmerRef.current.getBoundingClientRect();
                const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
                let percent = (clientX - rect.left) / rect.width;
                percent = Math.max(0, Math.min(1, percent));
                const newTime = percent * duration;

                if (trimInteraction === 'start') {
                    if (newTime < trimEnd - 1) setTrimStart(newTime);
                } else if (trimInteraction === 'end') {
                    if (newTime > trimStart + 1) setTrimEnd(newTime);
                } else if (trimInteraction === 'playhead') {
                    audioRef.current.currentTime = newTime;
                    setCurrentTime(newTime);
                }
            }, [trimInteraction, duration, trimStart, trimEnd]);

            const handleTrimPointerUp = useCallback((e) => {
                setTrimInteraction(null);
                if (e.target && e.target.hasPointerCapture && e.target.hasPointerCapture(e.pointerId)) {

                }
            }, []);

                if (trimInteraction) {

                    window.addEventListener('touchmove', handleTrimPointerMove, { passive: false });
                    window.addEventListener('pointerup', handleTrimPointerUp);
                    window.addEventListener('touchend', handleTrimPointerUp);
                    return () => {
                        window.removeEventListener('pointermove', handleTrimPointerMove);
                        window.removeEventListener('touchmove', handleTrimPointerMove);
                        window.removeEventListener('pointerup', handleTrimPointerUp);
                        window.removeEventListener('touchend', handleTrimPointerUp);
                    };
                }
            }, [trimInteraction, handleTrimPointerMove, handleTrimPointerUp]);

            const startExport = () => {
                if (!selectedEpisode) return showToast("Select an episode first.");
                if (audioError) return showToast("Cannot export: Audio blocked by CORS. Backend Proxy update required.", "error");
                
                initAudio();
                setIsExporting(true);
                setSelectedId(null); 
                
                saveHistory(rssUrl, selectedEpisode.title, feedData?.title, selectedEpisode.image || feedData?.image);
                
                setTimeout(() => {
                    const canvas = canvasRef.current;
                    const stream = canvas.captureStream(30); 
                    
                    if (selectedEpisode.audioUrl) {
                        const audioTracks = destRef.current.stream.getAudioTracks();
                        if (audioTracks.length > 0) stream.addTrack(audioTracks[0]);
                    }

                    const mimeTypes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/mp4'];
                    let selectedMimeType = '';
                    for (let type of mimeTypes) {
                        if (MediaRecorder.isTypeSupported(type)) { selectedMimeType = type; break; }
                    }

                    chunksRef.current = [];

                        a.href = url;
                        const ext = selectedMimeType.includes('mp4') ? 'mp4' : 'webm';
                        a.download = `audiogram-${Date.now()}.${ext}`;

                        URL.revokeObjectURL(url);

                    const exportEnd = ignoreTrim ? duration : trimEnd;

                        if (playPromise !== undefined) {
                            playPromise.then(() => setIsPlaying(true)).catch(e => {

                    ...(type === 'text' && { text: 'New Text Block', font: 'Inter', size: 64, color: '#ffffff', align: 'center', weight: '800', h: 100 }),
                    ...(type === 'image' && { h: 400, radius: 32, src: selectedEpisode?.image || 'https://via.placeholder.com/400', sourceType: selectedEpisode ? 'episode' : 'custom' }),
                    ...(type === 'waveform' && { h: 120, color: '#6366f1', style: 'bars' }),
                    ...(type === 'progress' && { h: 12, color: '#ffffff', radius: 6 })
                };
                sceneRef.current.elements.push(newEl);
                setSelectedId(newEl.id);
                forceUpdate();
            };

            const removeElement = (id) => {
                sceneRef.current.elements = sceneRef.current.elements.filter(el => el.id !== id);
                if (selectedId === id) setSelectedId(null);
                forceUpdate();
            };

            const changeFormat = (formatKey) => {
                const fmt = FORMATS[formatKey];
                setCurrentFormat(formatKey);
                sceneRef.current.width = fmt.width;
                sceneRef.current.height = fmt.height;
                sceneRef.current.format = formatKey;
                forceUpdate();
            };

            const moveLayer = (index, direction) => {
                const elements = [...sceneRef.current.elements];
                if (direction === 'up' && index < elements.length - 1) {
                    const temp = elements[index];
                    elements[index] = elements[index + 1];
                    elements[index + 1] = temp;
                } else if (direction === 'down' && index > 0) {
                    const temp = elements[index];
                    elements[index] = elements[index - 1];
                    elements[index - 1] = temp;
                }
                sceneRef.current.elements = elements;
                forceUpdate();
            };

            const handleSaveCustomTemplate = () => {
                if (!newTemplateName.trim()) return showToast("Please enter a template name.");
                saveTemplate(newTemplateName, {
                    width: sceneRef.current.width,
                    height: sceneRef.current.height,
                    background: sceneRef.current.background,
                    format: sceneRef.current.format,
                    elements: JSON.parse(JSON.stringify(sceneRef.current.elements))
                });
                setNewTemplateName('');
                showToast("Template saved locally!", "success");
            };

            const loadTemplate = (tmpl) => {
                sceneRef.current.width = tmpl.width;
                sceneRef.current.height = tmpl.height;
                sceneRef.current.background = tmpl.background;
                setCurrentFormat(tmpl.format || 'SQUARE');
                sceneRef.current.elements = JSON.parse(JSON.stringify(tmpl.elements));
                setSelectedId(null);
                forceUpdate();
            };

            const selectedEl = useMemo(() => 
                sceneRef.current.elements.find(el => el.id === selectedId),
            [selectedId, uiState]);

            const layersUI = [...sceneRef.current.elements].reverse().map((el, revIndex) => ({
                ...el, 
                originalIndex: sceneRef.current.elements.length - 1 - revIndex
            }));

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            };

            // Calculate precise visual clamps for the trimmer
            const leftPercent = duration > 1 ? Math.min(100, Math.max(0, (trimStart / duration) * 100)) : 0;
            const widthPercent = duration > 1 ? Math.min(100 - leftPercent, Math.max(0, ((trimEnd - trimStart) / duration) * 100)) : 100;
            const currentPercent = duration > 1 ? (currentTime / duration) * 100 : 0;

            return (
                <div className="flex flex-col h-[100dvh] bg-zinc-950 text-zinc-200 font-sans overflow-hidden selection:bg-indigo-500/30">
